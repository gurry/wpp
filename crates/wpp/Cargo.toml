[package]
edition.workspace = true
name = "wpp"
version = "0.1.0"
description = "WPP software tracing runtime for Rust drivers"
readme.workspace = true
license.workspace = true

[dependencies]
wpp-macros.workspace = true

[features]
default = ["user_mode"]
kernel_mode = ["wpp-macros/kernel_mode"]
user_mode = ["wpp-macros/user_mode"]
ifr = ["wpp-macros/ifr"]