[package]
edition = "2024"
name = "test-app"
version = "0.1.0"
description = "A simple user-mode Rust application that uses wpp for ETW and IFR tracing"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
# `kernel_mode` is intentionally not enabled: this app uses user-mode ETW and IFR APIs.
wpp = { path = "../../crates/wpp", version = "0.1.0", features = ["ifr"] }

[profile.release]
debug = 2
